name: Topic Discovery

on:
  workflow_dispatch:
  schedule:
    # 09:00 IST on Monday, Wednesday and Friday
    - cron: '30 3 * * 1,3,5'

permissions:
  contents: read
  issues: write

jobs:
  propose-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate topic proposals and open approval issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
        run: python scripts/topic_engine.py
