name: Script Approval Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  handle-script-command:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, 'Research + Script — ') &&
      (startsWith(github.event.comment.body, '/approve-script') ||
       startsWith(github.event.comment.body, '/revise-script') ||
       startsWith(github.event.comment.body, '/reject-script'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Gate 2 handler
        run: python -m py_compile scripts/script_approval_handler.py
      - name: Enforce script approval command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL || 'gemini-2.5-flash' }}
        run: python scripts/script_approval_handler.py
