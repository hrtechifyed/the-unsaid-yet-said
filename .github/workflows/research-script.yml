name: Research and Script

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  build-research-script:
    if: startsWith(github.event.issue.title, 'Approved Topic — ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build research dossier and script draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
        run: python scripts/research_script_engine.py
