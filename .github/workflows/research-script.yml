name: Research and Script

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Approved Topic issue number'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  build-research-script:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner &&
       startsWith(github.event.issue.title, 'Approved Topic — ') &&
       github.event.comment.body == '/run-research')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research engine
        run: python -m py_compile scripts/research_script_engine.py
      - name: Build research dossier and script draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL || 'gemini-2.5-flash' }}
          SOURCE_ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
        run: python scripts/research_script_engine.py
