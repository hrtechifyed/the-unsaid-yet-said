name: Research and Script

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Approved Topic issue number'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  build-research-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build research dossier and script draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: python scripts/research_script_engine.py
