name: YouTube Private Upload Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create harmless test video
        run: |
          ffmpeg -f lavfi -i color=c=black:s=1280x720:d=4 -f lavfi -i anullsrc=r=44100:cl=stereo \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -y /tmp/unsaid-api-test.mp4
      - name: Verify target channel and upload PRIVATE test
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_HANDLE: '@TheUnsaidYetSaid'
        run: |
          python scripts/youtube_upload.py \
            --file /tmp/unsaid-api-test.mp4 \
            --title 'API TEST — TheUnsaidYetSaid' \
            --description 'Private automation connectivity test. Safe to delete.' \
            --privacy private
