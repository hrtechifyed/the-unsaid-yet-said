name: Production Pipeline

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Script Approved issue number'
        required: true
        type: string
      dry_run:
        description: 'Render and verify channel without uploading a video'
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  production-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner &&
       startsWith(github.event.issue.title, 'Script Approved — ') &&
       github.event.comment.body == '/run-production')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts pillow
      - name: Compile production scripts
        run: python -m py_compile scripts/render_video.py scripts/youtube_upload.py scripts/production_engine.py
      - name: Render and upload PRIVATE preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_HANDLE: '@TheUnsaidYetSaid'
          SOURCE_ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          PRODUCTION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/production_engine.py
      - name: Preserve production package for Gate 3 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-package-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          path: /tmp/production/
          if-no-files-found: warn
          retention-days: 7
