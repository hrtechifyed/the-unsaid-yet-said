name: Production Pipeline

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  production-gate:
    if: startsWith(github.event.issue.title, 'Script Approved — ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open production package and mandatory final preview gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/production_engine.py
